name: CI

# Il token del workflow non serve a scrivere niente: qui si compila e si
# testa soltanto. Con i permessi dichiarati in cima, uno script di una
# dipendenza che girasse durante `npm ci` non troverebbe un token capace di
# toccare il repository.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # niente credenziali git lasciate nel runner dopo il checkout
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (motore di calcolo)
        run: npm test
      - name: Build
        run: npm run build
